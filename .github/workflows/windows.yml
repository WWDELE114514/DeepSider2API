name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # The interactive login uses the WebView2 webview binding, which requires
    # cgo, so the Windows binary must be built on a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Ensure MinGW (g++) is available
        shell: pwsh
        run: |
          $mingw = "C:\msys64\mingw64\bin"
          if (-not (Test-Path "$mingw\g++.exe")) {
            C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc"
          }
          Add-Content $env:GITHUB_PATH $mingw
          & "$mingw\g++.exe" --version | Select-Object -First 1

      - name: Tidy modules
        run: go mod tidy

      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test -timeout 5m ./...

      - name: Build Windows executables
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -tags timetzdata -ldflags="-s -w" -o dist/deepsider2api.exe ./cmd/server
          go build -trimpath -tags timetzdata -ldflags="-s -w" -o dist/deepsider2api-mcp.exe ./cmd/mcp

      - name: Package
        shell: pwsh
        run: |
          Copy-Item config.example.json dist/
          Copy-Item LICENSE dist/
          Copy-Item THIRD_PARTY_NOTICES.md dist/
          "${{ github.sha }}" | Out-File -Encoding ascii -NoNewline dist/BUILD_COMMIT.txt
          (Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }) | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepsider2api-windows-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deepsider2api.exe
            dist/deepsider2api-mcp.exe
            dist/config.example.json
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.md
          generate_release_notes: true
