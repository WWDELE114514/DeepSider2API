<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeepSider2API</title>
<style>
  :root{
    --glass: rgba(255,255,255,.07);
    --stroke: rgba(255,255,255,.16);
    --stroke-strong: rgba(255,255,255,.30);
    --text:#eef3fb; --muted:#a4b4cc;
    --brand:#7fb0ff; --ok:#5ee6a8; --warn:#ffd166; --err:#ff8fa3;
    --shadow: 0 16px 48px rgba(3,7,18,.5);
    --blur: blur(24px) saturate(180%);
    --radius: 20px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:#060912; overflow-x:hidden;
  }
  /* colourful blurred blobs behind the glass */
  body::before{
    content:""; position:fixed; inset:-25%; z-index:-2;
    background:
      radial-gradient(38% 38% at 16% 20%, rgba(99,102,241,.60), transparent 62%),
      radial-gradient(34% 34% at 84% 16%, rgba(236,72,153,.45), transparent 62%),
      radial-gradient(42% 42% at 74% 84%, rgba(34,211,238,.42), transparent 62%),
      radial-gradient(40% 40% at 18% 82%, rgba(16,185,129,.34), transparent 62%);
    filter: blur(50px);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,.10), transparent 55%),
      linear-gradient(180deg, rgba(6,9,18,.10), rgba(6,9,18,.55));
  }
  a{color:var(--brand);text-decoration:none}
  .glass{
    background:
      linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.02) 46%),
      var(--glass);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border:1px solid var(--stroke); border-radius:var(--radius);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(255,255,255,.05);
  }
  .layout{display:flex;min-height:100vh;padding:18px;gap:18px}
  .sidebar{width:214px;flex-shrink:0;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:18px;height:calc(100vh - 36px)}
  .brand{font-weight:800;font-size:16px;padding:4px 10px 18px;display:flex;align-items:center;gap:10px;letter-spacing:.3px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(140deg,#8ec5ff,#c084fc);box-shadow:0 0 14px rgba(140,180,255,.9), inset 0 1px 0 rgba(255,255,255,.6)}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;color:var(--muted);font-size:14px;cursor:pointer;border:1px solid transparent;transition:.18s}
  .nav a:hover{color:var(--text);background:rgba(255,255,255,.06);border-color:var(--stroke)}
  .nav a.active{color:#fff;background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.06));border-color:var(--stroke-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(0,0,0,.28)}
  .main{flex:1;min-width:0;padding:8px 6px}
  h1{font-size:22px;margin:2px 0 20px;font-weight:750;letter-spacing:.3px}
  h2{font-size:13px;margin:26px 0 12px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
  .card{padding:18px;position:relative;overflow:hidden}
  .card .k{font-size:12px;color:var(--muted);letter-spacing:.4px}
  .card .v{font-size:27px;font-weight:780;margin-top:8px;text-shadow:0 2px 18px rgba(120,160,255,.35)}
  .card::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(140,180,255,.28),transparent 70%)}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  .tablewrap{padding:6px;overflow:hidden}
  th,td{text-align:left;padding:12px 14px}
  th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
  tbody tr{background:rgba(255,255,255,.03);transition:.15s}
  tbody tr:nth-child(even){background:rgba(255,255,255,.055)}
  tbody tr:hover{background:rgba(255,255,255,.11)}
  tbody td:first-child{border-top-left-radius:12px;border-bottom-left-radius:12px}
  tbody td:last-child{border-top-right-radius:12px;border-bottom-right-radius:12px}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.06));
    border:1px solid var(--stroke-strong); color:var(--text);
    border-radius:12px; padding:9px 15px; font-size:13px; cursor:pointer;
    backdrop-filter: blur(12px) saturate(160%); -webkit-backdrop-filter: blur(12px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(0,0,0,.28);
    transition:.16s; font-weight:600;
  }
  .btn:hover{transform:translateY(-1px);background:linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.1))}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(180deg, rgba(127,176,255,.62), rgba(127,176,255,.28));border-color:rgba(170,205,255,.65)}
  .btn.ghost{background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .btn.danger{background:linear-gradient(180deg, rgba(255,143,163,.4), rgba(255,143,163,.14));border-color:rgba(255,143,163,.55);color:#ffdbe2}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
  input,select,textarea{
    background:rgba(255,255,255,.06); border:1px solid var(--stroke); color:var(--text);
    border-radius:12px; padding:10px 13px; font-size:13px; width:100%; outline:none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18); transition:.16s;
  }
  input:focus{border-color:rgba(170,205,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 3px rgba(127,176,255,.18)}
  input::placeholder{color:#7f8ea6}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .row>*{flex:0 0 auto}
  .row .grow{flex:1 1 220px}
  .pill{padding:3px 11px;border-radius:999px;font-size:11px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);white-space:nowrap;display:inline-block}
  .pill.ok{color:var(--ok);border-color:rgba(94,230,168,.5);box-shadow:0 0 12px rgba(94,230,168,.22) inset}
  .pill.off{color:var(--muted)}
  .pill.warn{color:var(--warn);border-color:rgba(255,209,102,.5)}
  .pill.err{color:var(--err);border-color:rgba(255,143,163,.5)}
  .muted{color:var(--muted)}
  .section{display:none;animation:fade .25s ease}
  .section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(6px)}
  #login .box{padding:30px;width:360px}
  #login h2{color:var(--text);margin:0 0 6px;font-size:20px;font-weight:750;text-transform:none;letter-spacing:0}
  pre{background:rgba(0,0,0,.28);border:1px solid var(--stroke);border-radius:12px;padding:12px;overflow:auto;font-size:12px;max-height:360px}
  .logline{font-family:Consolas,monospace;font-size:12px;padding:6px 10px;border-radius:10px;margin-bottom:4px;background:rgba(255,255,255,.035)}
  .logline .lv{display:inline-block;width:54px;font-weight:700}
  .lv.info{color:var(--brand)} .lv.warn{color:var(--warn)} .lv.error{color:var(--err)}
  .toast{position:fixed;right:24px;bottom:24px;padding:13px 18px;font-size:13px;opacity:0;transform:translateY(10px);transition:.28s;z-index:99;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;font-size:12px}
  .sidefoot{margin-top:auto;padding-top:14px}
</style>
</head>
<body>
<div id="login">
  <div class="box glass">
    <div class="brand" style="padding:0 0 14px"><span class="dot"></span> DeepSider2API</div>
    <p class="muted" style="font-size:13px;margin:0 0 14px">输入管理密钥（config.json 的 api_key）</p>
    <input id="loginKey" type="password" placeholder="管理密钥" />
    <div style="height:12px"></div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()">登 录</button>
  </div>
</div>

<div class="layout" id="app" style="display:none">
  <aside class="sidebar glass">
    <div class="brand"><span class="dot"></span> DeepSider2API</div>
    <nav class="nav">
      <a data-tab="dashboard" class="active">📊 仪表盘</a>
      <a data-tab="accounts">👥 账号池</a>
      <a data-tab="keys">🔑 API 密钥</a>
      <a data-tab="models">🧩 模型</a>
      <a data-tab="logs">📝 日志</a>
      <a data-tab="config">⚙️ 配置</a>
    </nav>
    <div class="sidefoot"><button class="btn ghost sm" style="width:100%;justify-content:center" onclick="logout()">退出登录</button></div>
  </aside>
  <main class="main">
    <section class="section active" id="tab-dashboard">
      <h1>仪表盘</h1>
      <div class="cards" id="statCards"></div>
      <h2>按模型统计</h2>
      <div class="tablewrap glass"><table id="modelStats"><thead><tr><th>模型</th><th>请求数</th></tr></thead><tbody></tbody></table></div>
    </section>

    <section class="section" id="tab-accounts">
      <h1>账号池</h1>
      <div class="row">
        <input class="grow" id="accName" placeholder="备注名（可选）" />
        <input class="grow" id="accToken" placeholder="DeepSider JWT（Bearer 后的 token）" />
        <button class="btn primary" onclick="addAccount()">添加账号</button>
      </div>
      <div class="tablewrap glass"><table id="accTable">
        <thead><tr><th>名称</th><th>邮箱</th><th>积分</th><th>套餐</th><th>状态</th><th>失败</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>

    <section class="section" id="tab-keys">
      <h1>API 密钥</h1>
      <div class="row">
        <input class="grow" id="keyName" placeholder="密钥名称" />
        <button class="btn primary" onclick="createKey()">生成密钥</button>
      </div>
      <div class="tablewrap glass"><table id="keyTable">
        <thead><tr><th>名称</th><th>前缀</th><th>用量</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>

    <section class="section" id="tab-models">
      <h1>模型列表</h1>
      <div class="row"><button class="btn ghost" onclick="loadModels()">刷新</button></div>
      <div class="tablewrap glass"><table id="modelTable"><thead><tr><th>botId</th><th>名称</th><th>类型</th><th>积分</th></tr></thead><tbody></tbody></table></div>
    </section>

    <section class="section" id="tab-logs">
      <h1>运行日志</h1>
      <div class="row">
        <button class="btn ghost" onclick="loadLogs()">刷新</button>
        <button class="btn danger" onclick="clearLogs()">清空</button>
      </div>
      <div id="logBox"></div>
    </section>

    <section class="section" id="tab-config">
      <h1>配置</h1>
      <div class="tablewrap glass" style="padding:18px">
        <div class="row"><span class="muted" style="width:120px">监听地址</span><input class="grow" id="cfgListen" /></div>
        <div class="row"><span class="muted" style="width:120px">管理密钥</span><input class="grow" id="cfgApiKey" /></div>
        <h2 style="margin-top:6px">模型编排（auto）</h2>
        <div class="row"><label class="muted"><input type="checkbox" id="cfgAutoEnabled" style="width:auto"> 启用 auto 虚拟模型</label></div>
        <div class="row"><span class="muted" style="width:120px">白天主模型</span><input class="grow" id="cfgDayPrimary" /></div>
        <div class="row"><span class="muted" style="width:120px">夜间主模型</span><input class="grow" id="cfgNightPrimary" /></div>
        <div class="row"><span class="muted" style="width:120px">白天时段</span><input id="cfgDayStart" style="width:80px" /> <span class="muted">—</span> <input id="cfgDayEnd" style="width:80px" /></div>
        <div class="row"><span class="muted" style="width:120px">降级链</span><input class="grow" id="cfgFallback" placeholder="逗号分隔" /></div>
        <button class="btn primary" onclick="saveConfig()">保存配置</button>
      </div>
    </section>
  </main>
</div>
<div class="toast glass" id="toast"></div>

<script>
let KEY = localStorage.getItem('ds2api_key') || '';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function api(path, opts={}){
  opts.headers = Object.assign({'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}, opts.headers||{});
  return fetch(path, opts).then(async r=>{
    const txt = await r.text();
    if(!r.ok) throw new Error(txt || ('HTTP '+r.status));
    try { return JSON.parse(txt); } catch(e){ return txt; }
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtTime(t){ if(!t||String(t).startsWith('0001')) return '-'; return new Date(t).toLocaleString(); }

function doLogin(){
  KEY = $('#loginKey').value.trim();
  if(!KEY) return;
  api('/api/panel/stats').then(()=>{
    localStorage.setItem('ds2api_key', KEY);
    $('#login').style.display='none'; $('#app').style.display='flex';
    refreshAll();
  }).catch(()=>{ toast('密钥无效'); });
}
function logout(){ localStorage.removeItem('ds2api_key'); location.reload(); }

$$('.nav a').forEach(a=>a.onclick=()=>{
  $$('.nav a').forEach(x=>x.classList.remove('active')); a.classList.add('active');
  $$('.section').forEach(s=>s.classList.remove('active'));
  $('#tab-'+a.dataset.tab).classList.add('active');
  if(a.dataset.tab==='accounts') loadAccounts();
  if(a.dataset.tab==='keys') loadKeys();
  if(a.dataset.tab==='models') loadModels();
  if(a.dataset.tab==='logs') loadLogs();
  if(a.dataset.tab==='config') loadConfig();
  if(a.dataset.tab==='dashboard') loadStats();
});

function loadStats(){
  api('/api/panel/stats').then(d=>{
    const cards=[
      ['总请求',d.total_requests],['成功',d.success_requests],['失败',d.failed_requests],
      ['字符数',d.total_tokens],['账号数',d.accounts],['密钥数',d.keys],['运行秒',d.uptime_seconds]
    ];
    $('#statCards').innerHTML=cards.map(c=>`<div class="card glass"><div class="k">${c[0]}</div><div class="v">${c[1]||0}</div></div>`).join('');
    const rows=Object.entries(d.per_model||{}).sort((a,b)=>b[1]-a[1]);
    $('#modelStats tbody').innerHTML=rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">暂无数据</td></tr>';
  }).catch(e=>toast('加载失败: '+e.message));
}

function loadAccounts(){
  api('/api/panel/accounts').then(d=>{
    $('#accTable tbody').innerHTML=(d.accounts||[]).map(a=>{
      const cd = a.cooldown_until && new Date(a.cooldown_until)>new Date();
      const st = a.enabled ? (cd?'<span class="pill warn">冷却</span>':'<span class="pill ok">启用</span>') : '<span class="pill off">停用</span>';
      return `<tr>
        <td>${esc(a.name)||'-'}</td>
        <td>${esc(a.email)||'<span class="muted">-</span>'}</td>
        <td>${a.credit_remaining||0}</td>
        <td>${esc(a.plan_name)||'-'}</td>
        <td>${st}</td>
        <td>${a.fail_count||0}</td>
        <td>
          <button class="btn ghost sm" onclick="toggleAccount('${a.id}',${!a.enabled})">${a.enabled?'停用':'启用'}</button>
          <button class="btn ghost sm" onclick="refreshAccount('${a.id}')">刷新</button>
          <button class="btn danger sm" onclick="delAccount('${a.id}')">删除</button>
        </td></tr>`;
    }).join('')||'<tr><td colspan="7" class="muted">暂无账号</td></tr>';
  }).catch(e=>toast('加载失败: '+e.message));
}
function addAccount(){
  const name=$('#accName').value.trim(), token=$('#accToken').value.trim();
  if(!token) return toast('请填写 token');
  api('/api/panel/accounts',{method:'POST',body:JSON.stringify({name,token})})
    .then(()=>{ $('#accName').value='';$('#accToken').value=''; toast('已添加'); loadAccounts(); })
    .catch(e=>toast('添加失败: '+e.message));
}
function toggleAccount(id,enabled){ api(`/api/panel/accounts/${id}/toggle`,{method:'POST',body:JSON.stringify({enabled})}).then(loadAccounts).catch(e=>toast(e.message)); }
function delAccount(id){ if(confirm('确认删除？')) api(`/api/panel/accounts/${id}`,{method:'DELETE'}).then(loadAccounts).catch(e=>toast(e.message)); }
function refreshAccount(id){ toast('刷新中...'); api(`/api/panel/accounts/${id}/refresh`,{method:'POST'}).then(()=>{toast('已刷新');loadAccounts();}).catch(e=>toast('刷新失败: '+e.message)); }

function loadKeys(){
  api('/api/panel/keys').then(d=>{
    $('#keyTable tbody').innerHTML=(d.keys||[]).map(k=>`<tr>
      <td>${esc(k.name)||'-'}</td>
      <td><code>${esc(k.prefix)}...</code></td>
      <td>${k.usage||0}</td>
      <td>${k.enabled?'<span class="pill ok">启用</span>':'<span class="pill off">停用</span>'}</td>
      <td>${fmtTime(k.created_at)}</td>
      <td>
        <button class="btn ghost sm" onclick="toggleKey('${k.id}',${!k.enabled})">${k.enabled?'停用':'启用'}</button>
        <button class="btn danger sm" onclick="delKey('${k.id}')">删除</button>
      </td></tr>`).join('')||'<tr><td colspan="6" class="muted">暂无密钥</td></tr>';
  }).catch(e=>toast('加载失败: '+e.message));
}
function createKey(){
  const name=$('#keyName').value.trim()||'key';
  api('/api/panel/keys',{method:'POST',body:JSON.stringify({name})}).then(d=>{
    $('#keyName').value='';
    prompt('请立即复制，密钥只显示一次：', d.key);
    loadKeys();
  }).catch(e=>toast('创建失败: '+e.message));
}
function toggleKey(id,enabled){ api(`/api/panel/keys/${id}/toggle`,{method:'POST',body:JSON.stringify({enabled})}).then(loadKeys).catch(e=>toast(e.message)); }
function delKey(id){ if(confirm('确认删除？')) api(`/api/panel/keys/${id}`,{method:'DELETE'}).then(loadKeys).catch(e=>toast(e.message)); }

function loadModels(){
  $('#modelTable tbody').innerHTML='<tr><td colspan="4" class="muted">加载中...</td></tr>';
  api('/api/panel/models').then(d=>{
    $('#modelTable tbody').innerHTML=(d.models||[]).map(m=>`<tr>
      <td><code>${esc(m.botId)}</code></td><td>${esc(m.name||m.modelName||'')}</td>
      <td>${esc(m.classification||'')}</td><td>${m.credits||0}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">无模型</td></tr>';
  }).catch(e=>{ $('#modelTable tbody').innerHTML=`<tr><td colspan="4" class="muted">加载失败: ${esc(e.message)}</td></tr>`; });
}

function loadLogs(){
  api('/api/panel/logs').then(d=>{
    const logs=(d.logs||[]).slice().reverse();
    $('#logBox').innerHTML=logs.map(l=>`<div class="logline"><span class="lv ${l.level}">${l.level}</span> <span class="muted">${fmtTime(l.time)}</span> ${esc(l.message)}</div>`).join('')||'<div class="muted">暂无日志</div>';
  }).catch(e=>toast(e.message));
}
function clearLogs(){ api('/api/panel/logs',{method:'DELETE'}).then(loadLogs).catch(e=>toast(e.message)); }

function loadConfig(){
  api('/api/panel/config').then(d=>{
    $('#cfgListen').value=d.listen||''; $('#cfgApiKey').value=d.api_key||'';
    const am=d.auto_model||{};
    $('#cfgAutoEnabled').checked=!!am.enabled;
    $('#cfgDayPrimary').value=am.day_primary||''; $('#cfgNightPrimary').value=am.night_primary||'';
    $('#cfgDayStart').value=am.day_start||8; $('#cfgDayEnd').value=am.day_end||23;
    $('#cfgFallback').value=(am.fallback||[]).join(',');
  }).catch(e=>toast(e.message));
}
function saveConfig(){
  const body={
    listen:$('#cfgListen').value.trim(), api_key:$('#cfgApiKey').value.trim(),
    auto_model:{
      enabled:$('#cfgAutoEnabled').checked,
      virtual_id:'auto',
      day_primary:$('#cfgDayPrimary').value.trim(),
      night_primary:$('#cfgNightPrimary').value.trim(),
      day_start:parseInt($('#cfgDayStart').value)||8,
      day_end:parseInt($('#cfgDayEnd').value)||23,
      fallback:$('#cfgFallback').value.split(',').map(s=>s.trim()).filter(Boolean),
      on_empty:true
    }
  };
  api('/api/panel/config',{method:'POST',body:JSON.stringify(body)}).then(()=>toast('已保存')).catch(e=>toast('保存失败: '+e.message));
}

function refreshAll(){ loadStats(); loadAccounts(); loadKeys(); }

if(KEY){
  api('/api/panel/stats').then(()=>{ $('#login').style.display='none'; $('#app').style.display='flex'; refreshAll(); })
    .catch(()=>{ localStorage.removeItem('ds2api_key'); });
}
</script>
</body>
</html>
